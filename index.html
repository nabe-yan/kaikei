<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>富士見横丁レトロ</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/main_logo.png">
  <link rel="apple-touch-icon" href="./assets/main_logo.png">
  <meta name="theme-color" content="#c8332a">
  <style>
    /* ============================================================
       デザイントークン（トンマナ.md 14章 準拠）
       ============================================================ */
    :root {
      --bg: #f5ead4;
      --bg-dark: #2b1d14;
      --paper: #fbf3df;
      --ink: #2b1d14;
      --red: #c8332a;
      --red-dark: #9c241c;
      --green: #3d6b3a;
      --green-dark: #2d5229;
      --line: #d9c7a3;
      --shadow: rgba(43, 29, 20, 0.15);
      --color-warning: #f5a623;

      --gold: #c89938;
      --gold-deep: #806123;

      --gray-100: #ccc;
      --gray-300: #aaa;
      --gray-500: #888;
      --gray-700: #666;
      --gray-900: #444;

      /* ジャンルカラー（トンマナ 10章・今シーズン適用値） */
      --genre-food-bg: #fff8e1;         --genre-food-ink: #7a4f1e;
      --genre-alcohol-bg: #e8f0e8;      --genre-alcohol-ink: #2e6b50;
      --genre-non-alcohol-bg: #f3e7ed;  --genre-non-alcohol-ink: #6f2a4d;
      /* soft-drinkジャンルは2026-09-11にnon-alcoholへ統合、トークンは削除 */

      /* サイズ色：R/M/J の「文字色だけ」色分けに使う（ボタン背景・価格・チップ背景は
         無彩色のまま）。fullwidth-grid-bottombar 要件11 */
      --size-r-ink: #256235;   /* R＝緑 */
      --size-m-ink: #9a5a0f;   /* M＝橙 */
      --size-j-ink: #a5382b;   /* J＝赤 */

      --fs-2xs: 11px; --fs-xs: 12px; --fs-sm: 13px; --fs-base: 14px;
      --fs-md: 16px;  --fs-lg: 18px; --fs-xl: 22px; --fs-2xl: 28px; --fs-3xl: 44px;

      --font-label: "Hiragino Mincho ProN", "Yu Mincho", "游明朝", serif;
      --font-numeral: -apple-system, "SF Pro", "Hiragino Sans", sans-serif;

      --radius-xs: 4px; --radius-sm: 8px; --radius-md: 12px;
      --radius-lg: 16px; --radius-pill: 999px;

      --hit-min: 44px;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg-dark);
      font-family: var(--font-label);
      color: var(--ink);
      font-size: var(--fs-base);
    }

    html {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      /* ダブルタップズームを無効化（ピンチはJSのgestureイベント抑止で対応） */
      touch-action: manipulation;
    }

    .num { font-family: var(--font-numeral); font-variant-numeric: tabular-nums; }

    /* ── VIEWS ── */
    .view {
      display: none;
      position: fixed;
      inset: 0;
      height: calc(var(--real-vh, 100vh));
      background: var(--bg);
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
    }
    .view.active { display: flex; }

    /* ── STORAGE WARNING ── */
    .storage-warning {
      background: var(--color-warning);
      color: #fff;
      text-align: center;
      padding: 8px 12px;
      font-size: var(--fs-xs);
      font-weight: 700;
      flex-shrink: 0;
    }

    /* ============================================================
       ORDER VIEW：全幅グリッド（上） + 下部バー（下）
       fullwidth-grid-bottombar：右サイドバーを撤去し縦2段に
       ============================================================ */
    #app-order { flex-direction: column; }

    .grid-area {
      position: relative; /* 売上確認ボタンを右上に絶対配置するため（要件9） */
      flex: 1;
      min-width: 0;
      /* 品目グリッドはスクロールさせない。対象サイズ（1180×820〜1366×1024）で
         3ジャンル15品目が必ず収まる（menu-merge-grid-lock 要件5） */
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 12px;
    }

    /* 売上確認：グリッド右上（先頭ジャンル「フード」の1行目・空いている6カラム目の位置） */
    .btn-sales-nav {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 5;
      min-height: 40px;
      padding: 0 18px;
      border-radius: var(--radius-sm);
      background: var(--paper);
      border: 1.5px solid var(--line);
      color: var(--gray-700);
      font-size: var(--fs-sm);
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-sales-nav:hover { background: var(--line); }
    .btn-sales-nav:active { background: var(--gray-100); }

    /* ジャンルは「左の縦ラベル」＋右に品目グリッド（横並び）。
       見出しの帯を上に置かないぶん縦が詰まる（fullwidth-grid-bottombar 要件14） */
    .genre-section {
      display: flex;
      align-items: stretch;
      gap: 8px;
      margin-bottom: 14px;
      /* ジャンルごとに薄い背景をつけて見分けやすくする（背景色はJS側で
         GENRE_TOKEN.bgをインラインstyleで指定。genre-section-background）。
         縦方向のpaddingは付けない（iPad mini等の小さめビューポートで
         グリッドが1画面に収まらなくなるため。要件4の「収まる」制約を優先） */
      padding: 0 8px;
      border-radius: var(--radius-md);
    }
    .genre-section:last-child { margin-bottom: 0; }

    .genre-section-header {
      flex-shrink: 0;
      width: 30px;
      writing-mode: vertical-rl;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 0;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: var(--fs-md);
      letter-spacing: 0.12em;
      /* 背景・文字色はジャンル色（インラインで指定）。genre-sectionの
         背景と同色になるため、内側に薄い輪郭を入れてラベルの範囲を保つ */
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
    }

    .item-grid {
      flex: 1;
      min-width: 0;
      display: grid;
      /* 6カラム系。単一サイズ品目 = 1カラム、複数サイズ品目 = 2カラム（要件12） */
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
    }

    .item-card {
      background: var(--paper);
      border: 1.5px solid var(--line);
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      min-height: 110px;
      /* overflow:hidden にすると端の列で qty-minus/qty-badge の角のはみ出しが
         切れるため付けない。ヘッダー上角の丸めは .item-card-header で個別指定 */
    }
    /* 複数サイズ品目（R/M/J）：カードを2カラム分に広げてボタンを大きく */
    .item-card--wide { grid-column: span 2; }

    .item-card-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      background: rgba(43, 29, 20, 0.06);
      flex-shrink: 0;
      border-top-left-radius: calc(var(--radius-md) - 1.5px);
      border-top-right-radius: calc(var(--radius-md) - 1.5px);
    }

    .item-card-icon { width: 19px; height: 19px; flex-shrink: 0; color: var(--gray-700); }
    .item-card-icon svg { width: 100%; height: 100%; }

    .item-card-name {
      /* 品目名は「探しやすさ」優先の機能ラベル。明朝はW6で頭打ちのため、
         ここだけゴシック（Hiragino Sans はW8まである）で太くする */
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      font-size: var(--fs-base);
      font-weight: 800;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-card-body {
      flex: 1;
      display: flex;
      gap: 8px;
      /* 上に余白を足して、スロット角の qty-minus / qty-badge がヘッダーと重ならないように */
      padding: 10px 8px 7px;
      min-height: 0;
    }

    /* 1サイズぶんの枠。タップ＝＋1の品目ボタン＋（数量>0のとき）左上マイナス・
       右上数量バッジを重ねる。統一パターン（fullwidth-grid-bottombar 要件2） */
    .item-size-slot {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* 品目ボタン：ボタン本体タップ＝＋1（全品目共通）。
       背景・文字色は全ボタン共通の無彩色（カラフルにしない・要件8） */
    .item-price-btn {
      flex: 1;
      background: var(--bg);
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-height: var(--hit-min);
      cursor: pointer;
      touch-action: manipulation;
      font-family: inherit;
    }
    .item-price-btn:hover { filter: brightness(0.97); }
    .item-price-btn:active { animation: itemFlash 0.12s ease-out; }

    /* R/M/J ラベル：文字色だけサイズ色（--sz）で色分け。背景・枠は付けない（要件11） */
    .item-size-label {
      color: var(--sz, var(--ink));
      font-size: var(--fs-sm);
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1.2;
    }
    .item-size-price { font-size: var(--fs-md); font-weight: 700; color: var(--ink); line-height: 1; }

    /* 数量バッジ（右上）：表示専用。今より大きく・読みやすく（要件4） */
    .qty-badge {
      position: absolute;
      top: -3px;
      right: -7px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 26px;
      padding: 0 6px;
      background: var(--red);
      color: #fff;
      border: 2px solid var(--paper);
      border-radius: var(--radius-pill);
      font-size: var(--fs-md);
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
    }

    /* マイナスボタン（左上・バッジの反対側）：タップ＝−1（要件5） */
    .qty-minus {
      position: absolute;
      top: -5px;
      left: -7px;
      z-index: 2;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper);
      color: var(--red);
      border: 1.5px solid var(--red);
      border-radius: var(--radius-pill);
      font-size: var(--fs-lg);
      font-weight: 700;
      font-family: inherit;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
    }
    .qty-minus:hover { background: #f7e3e0; }
    .qty-minus:active { background: var(--red); color: #fff; }

    @keyframes itemFlash {
      0% { filter: brightness(1); }
      40% { filter: brightness(1.3); }
      100% { filter: brightness(1); }
    }

    /* ============================================================
       下部バー（注文画面の最下部・横1行）
       合計金額 … [ 全クリア ][ お会計 ][ ピッタリ ]（横いっぱいに広げる）
       fullwidth-grid-bottombar 要件3・10
       ============================================================ */
    .app-footer {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 8px 16px calc(8px + var(--safe-bottom));
      background: var(--paper);
      border-top: 1.5px solid var(--line);
    }
    /* 合計金額：バーの3割・大きく見やすく（要件13） */
    .app-footer-total {
      flex: 3;
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-size: var(--fs-md);
      font-weight: 700;
      color: var(--gray-700);
      white-space: nowrap;
      /* タップでカート内訳ポップアップを開く（cart-detail-popup）。
         バーの高さ自体で44pt以上のタップ領域を確保している */
      cursor: pointer;
      border-radius: var(--radius-sm);
      touch-action: manipulation;
    }
    .app-footer-total:active { background: var(--line); }
    .app-footer-total .num { font-size: var(--fs-3xl); font-weight: 700; color: var(--red); }
    /* 会計ボタン群：バーの7割（要件13）。3ボタン均等 */
    .app-footer-actions { flex: 7; display: flex; gap: 12px; }

    .btn-clear, .btn-checkout, .btn-pittari-checkout {
      flex: 1;
      min-height: 52px;
      padding: 0 16px;
      border-radius: var(--radius-md);
      font-size: var(--fs-md);
      font-weight: 700;
      font-family: inherit;
      letter-spacing: 0.04em;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-clear {
      background: transparent;
      border: 1.5px solid var(--line);
      color: var(--gray-700);
    }
    .btn-clear:hover { background: var(--line); }
    .btn-clear:active { background: var(--gray-100); }
    .btn-checkout {
      background: var(--green);
      border: none;
      color: #fff;
    }
    .btn-checkout:hover { background: #457a41; }
    .btn-checkout:active { background: var(--green-dark); }
    .btn-checkout:disabled { background: var(--gray-100); color: var(--gray-300); cursor: not-allowed; }
    /* 「ピッタリ」：モーダルを開かず1タップで会計確定する即実行ボタン。
       「お会計」（--green）より濃い --green-dark で区別する */
    .btn-pittari-checkout {
      background: var(--green-dark);
      border: none;
      color: #fff;
    }
    .btn-pittari-checkout:hover { background: #24421f; }
    .btn-pittari-checkout:active { background: #1c331a; }
    .btn-pittari-checkout:disabled { background: var(--gray-100); color: var(--gray-300); cursor: not-allowed; }

    /* ============================================================
       会計モーダル（2026-09-11：常設パネルから復帰。checkout-modal-restore）
       ============================================================ */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(43, 29, 20, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      transition: opacity 0.16s ease-out;
      z-index: 100;
    }
    .modal-bg.open { display: flex; opacity: 1; }
    .modal-sheet {
      background: var(--paper);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 640px;
      max-height: calc(100% - 8px);
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transform: scale(0.96);
      transition: transform 0.16s ease-out;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
    }
    .modal-bg.open .modal-sheet { transform: scale(1); }
    .modal-title { font-size: var(--fs-lg); font-weight: 700; color: var(--ink); text-align: center; }

    /* 会計金額表示・紙幣クイック・テンキー（モーダル内） */
    .modal-amounts { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .modal-amount-block { flex: 1; text-align: center; }
    .modal-amount-label { font-size: var(--fs-2xs); color: var(--gray-500); margin-bottom: 2px; }
    .modal-total-amount { font-size: var(--fs-2xl); font-weight: 700; color: var(--red); line-height: 1; }
    .modal-received-display { font-size: var(--fs-2xl); font-weight: 700; color: var(--ink); line-height: 1; min-height: 34px; }
    .modal-received-display.empty { color: var(--gray-300); }
    .change-amount { font-size: var(--fs-2xl); font-weight: 700; color: var(--gold-deep); line-height: 1; }
    .change-amount.shortage { color: var(--red); font-size: var(--fs-xl); }

    /* モーダルを横長に：紙幣クイック（左）とテンキー（右）を並べる */
    .modal-columns { display: flex; gap: 14px; align-items: flex-start; }
    .modal-columns > * { flex: 1; min-width: 0; }

    /* 紙幣クイックボタン：2列×3行（テンキー4行と高さを揃える） */
    .bill-btns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .bill-btn {
      background: var(--bg-dark); color: #fff; border: none;
      border-radius: var(--radius-sm); min-height: 56px;
      font-size: var(--fs-md); font-weight: 700; font-family: inherit;
      cursor: pointer; touch-action: manipulation;
    }
    .bill-btn:hover { background: #3a2a1e; }
    .bill-btn:active { background: var(--gray-900); }
    /* 「ぴったり」は最頻出操作として最も目立たせる（要件4.2） */
    .bill-btn-pittari { background: var(--green); font-size: var(--fs-lg); }
    .bill-btn-pittari:hover { background: #457a41; }
    .bill-btn-pittari:active { background: var(--green-dark); }

    .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .numpad-btn {
      background: var(--paper); border: 1.5px solid var(--line);
      border-radius: var(--radius-sm); min-height: 56px;
      font-size: var(--fs-2xl); font-weight: 700; font-family: inherit;
      color: var(--ink); cursor: pointer; touch-action: manipulation;
    }
    .numpad-btn:hover { background: #f0e6cc; }
    .numpad-btn:active { background: var(--line); }
    .numpad-btn.numpad-del { background: var(--bg); color: var(--red); }
    .numpad-btn.numpad-clear { background: var(--bg); color: var(--red); font-size: var(--fs-lg); }
    .numpad-btn.numpad-clear:active { background: var(--red); color: #fff; }

    .modal-actions { display: flex; gap: 10px; }
    .btn-modal-confirm {
      flex: 1; width: 100%; background: var(--red); border: none;
      border-radius: var(--radius-md); min-height: 56px;
      font-size: var(--fs-lg); font-weight: 700; font-family: inherit;
      color: #fff; cursor: pointer; touch-action: manipulation; letter-spacing: 0.05em;
    }
    .btn-modal-confirm:hover { background: #b02c24; }
    .btn-modal-confirm:active { background: var(--red-dark); }
    .btn-modal-confirm:disabled { background: var(--gray-100); color: var(--gray-300); cursor: not-allowed; }

    /* ぴったり金額で1タップ完了（2026-09-11追加。要件7） */
    .btn-pittari-confirm {
      flex: 1; width: 100%; background: var(--green); border: none;
      border-radius: var(--radius-md); min-height: 56px;
      font-size: var(--fs-sm); font-weight: 700; font-family: inherit;
      color: #fff; cursor: pointer; touch-action: manipulation; letter-spacing: 0.02em;
    }
    .btn-pittari-confirm:hover { background: #457a41; }
    .btn-pittari-confirm:active { background: var(--green-dark); }

    /* ============================================================
       売上確認ビュー
       ============================================================ */
    #app-sales { flex-direction: column; overflow: hidden; }
    .sales-header {
      background: var(--bg-dark); color: #fff;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; flex-shrink: 0; min-height: 56px;
    }
    .sales-header-title { font-size: var(--fs-lg); font-weight: 700; letter-spacing: 0.08em; }
    .session-id-sales { font-size: var(--fs-xs); opacity: 0.7; }
    .btn-close-sales {
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
      color: #fff; border-radius: var(--radius-sm); min-height: var(--hit-min); padding: 0 16px;
      font-size: var(--fs-sm); font-weight: 700; font-family: inherit;
      cursor: pointer; touch-action: manipulation;
    }
    .btn-close-sales:hover { background: rgba(255,255,255,0.25); }
    .btn-close-sales:active { background: rgba(255,255,255,0.35); }

    .date-selector { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 20px; background: var(--bg); border-bottom: 1px solid var(--line); flex-shrink: 0; }
    .date-btn {
      background: var(--paper); border: 1.5px solid var(--line); border-radius: var(--radius-sm);
      min-height: var(--hit-min); padding: 0 14px; font-size: var(--fs-sm); font-weight: 700;
      font-family: inherit; color: var(--ink); cursor: pointer; touch-action: manipulation;
    }
    .date-btn:hover { background: #f0e6cc; }
    .date-btn.active { background: var(--bg-dark); color: var(--paper); border-color: var(--bg-dark); }
    .date-btn:active { background: var(--line); }

    /* 売上確認は横幅いっぱいで表示（max-width 制約を撤去。persist-and-sales-view 要件3） */
    .sales-body { flex: 1; overflow-y: auto; padding: 16px clamp(16px, 3vw, 40px); width: 100%; -webkit-overflow-scrolling: touch; }

    .sales-total-card { background: var(--paper); border-radius: var(--radius-md); padding: 20px; text-align: center; margin-bottom: 20px; border: 1px solid var(--line); box-shadow: 0 2px 8px var(--shadow); }
    .sales-total-label { font-size: var(--fs-base); color: var(--gray-500); margin-bottom: 4px; }
    .sales-total-amount { font-size: var(--fs-3xl); font-weight: 700; color: var(--red); line-height: 1; }
    .sales-total-count { font-size: var(--fs-sm); color: var(--gray-500); margin-top: 4px; }

    .sales-section-title { font-size: var(--fs-md); font-weight: 700; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 2px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .sales-card { background: var(--paper); border-radius: var(--radius-md); border: 1px solid var(--line); margin-bottom: 20px; overflow: hidden; }

    /* 取引履歴・品目別集計は文字を大きく（要件4） */
    .item-stat-row { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); gap: 10px; }
    .item-stat-row:last-child { border-bottom: none; }
    .item-stat-name { flex: 1; font-size: var(--fs-base); font-weight: 700; }
    .item-stat-size { font-size: var(--fs-xs); background: var(--gold); color: var(--ink); padding: 2px 7px; border-radius: var(--radius-xs); }
    .item-stat-qty { font-size: var(--fs-md); font-weight: 700; min-width: 48px; text-align: right; }
    .item-stat-amount { font-size: var(--fs-md); font-weight: 700; color: var(--red); min-width: 96px; text-align: right; }

    .tx-row { padding: 13px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
    .tx-row:last-child { border-bottom: none; }
    .tx-row-main { flex: 1; min-width: 0; }
    .tx-row-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; gap: 12px; }
    .tx-time { font-size: var(--fs-sm); color: var(--gray-500); flex-shrink: 0; }
    .tx-total { font-size: var(--fs-lg); font-weight: 700; color: var(--red); }
    .tx-items { font-size: var(--fs-sm); color: var(--gray-700); line-height: 1.5; }
    .sales-empty { text-align: center; color: var(--gray-300); font-size: var(--fs-sm); padding: 24px; }

    .btn-delete-mode-toggle {
      font-weight: 700; font-family: inherit; border-radius: var(--radius-sm);
      min-height: 36px; padding: 0 14px; font-size: var(--fs-xs);
      border: 1.5px solid var(--line); background: transparent; color: var(--gray-500);
      cursor: pointer; touch-action: manipulation;
    }
    .btn-delete-mode-toggle.active { border-color: var(--red); background: var(--red); color: #fff; }
    .btn-tx-delete {
      background: var(--red); color: #fff; border: none; border-radius: var(--radius-sm);
      font-weight: 700; font-family: inherit; min-height: var(--hit-min); padding: 0 16px;
      font-size: var(--fs-sm); cursor: pointer; touch-action: manipulation; flex-shrink: 0;
    }
    .btn-tx-delete:hover { background: #b02c24; }

    /* 1日ぶんのデータを長押しで削除（delete-day-data）。破壊的操作なので
       輪郭のみの控えめな見た目＋長押しでしか反応しない */
    .btn-delete-day {
      position: relative;
      overflow: hidden;
      display: block;
      margin: 0 auto 20px;
      min-height: var(--hit-min);
      padding: 0 20px;
      background: var(--paper);
      border: 1.5px solid var(--red);
      border-radius: var(--radius-sm);
      color: var(--red);
      font-size: var(--fs-sm);
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-delete-day-fill {
      position: absolute;
      inset: 0;
      width: 0%;
      background: rgba(200, 51, 42, 0.22);
      transition: width 0s linear;
    }
    .btn-delete-day.pressing .btn-delete-day-fill {
      width: 100%;
      transition: width 700ms linear;
    }
    .btn-delete-day-label { position: relative; z-index: 1; }

    /* 削除確認ポップアップ（小型・独立した確認ダイアログ） */
    .confirm-sheet {
      background: var(--paper);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 380px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
      transform: scale(0.96);
      transition: transform 0.16s ease-out;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
    }
    .modal-bg.open .confirm-sheet { transform: scale(1); }
    .confirm-title { font-size: var(--fs-lg); font-weight: 700; color: var(--ink); }
    .confirm-detail { font-size: var(--fs-md); color: var(--gray-700); }
    .confirm-note { font-size: var(--fs-xs); color: var(--red); }
    .confirm-actions { display: flex; gap: 10px; margin-top: 8px; }
    .btn-confirm-cancel, .btn-confirm-danger {
      flex: 1;
      min-height: var(--hit-min);
      border-radius: var(--radius-md);
      font-size: var(--fs-md);
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-confirm-cancel { background: transparent; border: 1.5px solid var(--line); color: var(--gray-700); }
    .btn-confirm-cancel:hover { background: var(--line); }
    .btn-confirm-danger { background: var(--red); border: none; color: #fff; }
    .btn-confirm-danger:hover { background: #b02c24; }
    .btn-confirm-danger:active { background: var(--red-dark); }

    /* カート内訳ポップアップ（cart-detail-popup）：確認ポップアップと同系統だが
       一覧を収めるぶん少し横長・縦に伸びる。行は売上確認の item-stat-row を
       流用（新規CSSを増やさず視覚的に一貫させる） */
    .cart-detail-sheet {
      background: var(--paper);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 460px;
      max-height: 80vh;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
      transform: scale(0.96);
      transition: transform 0.16s ease-out;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
    }
    .modal-bg.open .cart-detail-sheet { transform: scale(1); }
    .cart-detail-list {
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
    }
    .cart-detail-total {
      display: flex;
      justify-content: space-between;
      font-size: var(--fs-lg);
      font-weight: 700;
      padding-top: 4px;
      border-top: 1.5px solid var(--line);
    }
    .cart-detail-total .num { color: var(--red); }

    .share-section { background: var(--paper); border-radius: var(--radius-md); border: 1px solid var(--line); padding: 16px; margin-bottom: 20px; }
    .share-section-title { font-size: var(--fs-md); font-weight: 700; margin-bottom: 12px; }
    .btn-export {
      width: 100%; background: var(--bg-dark); color: #fff; border: none;
      border-radius: var(--radius-sm); min-height: var(--hit-min);
      font-size: var(--fs-md); font-weight: 700; font-family: inherit;
      cursor: pointer; touch-action: manipulation; margin-bottom: 8px;
    }
    .btn-export:hover { background: #3a2a1e; }
    /* この日のデータをダウンロード（download-day-data）：エクスポート系だが
       完了後にその日のデータを消すため、注意を引く暖色（warning）にする */
    .btn-download-day {
      width: 100%; background: var(--color-warning); color: var(--ink); border: none;
      border-radius: var(--radius-sm); min-height: var(--hit-min);
      font-size: var(--fs-md); font-weight: 700; font-family: inherit;
      cursor: pointer; touch-action: manipulation; margin-bottom: 8px;
    }
    .btn-download-day:hover { background: #e0951c; }
    .btn-import-toggle {
      width: 100%; background: transparent; border: 1.5px solid var(--line);
      border-radius: var(--radius-sm); min-height: var(--hit-min);
      font-size: var(--fs-base); font-weight: 700; font-family: inherit;
      color: var(--ink); cursor: pointer; touch-action: manipulation; margin-top: 8px;
    }
    .btn-import-toggle:hover { background: #f0e6cc; }
    .import-area { margin-top: 10px; }
    .import-textarea, .export-fallback-textarea {
      width: 100%; height: 110px; border: 1.5px solid var(--line);
      border-radius: var(--radius-sm); padding: 10px; font-size: var(--fs-xs);
      font-family: monospace; resize: vertical; background: #fff; color: var(--ink);
      outline: none; user-select: text; -webkit-user-select: text; margin-bottom: 8px;
    }
    .import-textarea:focus { border-color: var(--gold-deep); }
    .btn-import-exec {
      width: 100%; background: var(--gold); color: var(--ink); border: none;
      border-radius: var(--radius-sm); min-height: var(--hit-min);
      font-size: var(--fs-md); font-weight: 700; font-family: inherit;
      cursor: pointer; touch-action: manipulation;
    }
    .btn-import-exec:hover { background: #b08a30; }
    .export-fallback-note { font-size: var(--fs-2xs); color: var(--gray-500); margin-top: 4px; }

    /* ── TOAST ── */
    #toast {
      position: fixed; bottom: calc(56px + var(--safe-bottom)); left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg-dark); color: #fff; padding: 12px 22px;
      border-radius: var(--radius-pill); font-size: var(--fs-md); font-weight: 700;
      white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
      z-index: 9999; opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.success { background: var(--green); }
    #toast.error { background: var(--red); }
    #toast.warning { background: var(--color-warning); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  </style>
</head>

<body>
  <!-- ORDER VIEW -->
  <div id="app-order" class="view active">

  <!-- カート内訳ポップアップ（合計金額タップで開く。cart-detail-popup） -->

      // ¥300ドリンク統合の1品目（レッドブル・水・お茶・MATCH・ポカリを1枚に）。ペットボトル
      'soft-drink': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4v2.2c0 .5.2 1 .6 1.4l1.2 1.2c.8.8 1.2 1.8 1.2 2.9V19a3 3 0 0 1-3 3h-4a3 3 0 0 1-3-3V9.7c0-1.1.4-2.1 1.2-2.9l1.2-1.2c.4-.4.6-.9.6-1.4V2z"/><path d="M8 11h8"/></svg>',
    }
    function getItemSvg(item) { return ITEM_SVG[item.icon || item.id] || '' }

    // 品目アイコンの色（味・素材をイメージした色。ジャンル色（2.5）や
    // サイズ色（2.6）とは別レイヤーで、アイコン単体の視認性・見分けやすさの
    // ためだけに使う。トンマナ 6.2追補）
    const ICON_COLOR = {
      beer: '#a8791a',            // ビール：麦芽の金
      highball: '#b8730f',        // ハイボール：琥珀
      'lemon-sour': '#a68a15',    // レモンサワー：黄
      'redbull-vodka': '#3a5f8a', // レッドブルウォッカ：缶の青
      'cc-blue': '#2f6fa8',       // CCブルーサイダー：青
      hibiscus: '#a83a54',        // ハイビスカス：紅
      yakisoba: '#8a5a2e',        // 焼きそば：ソース色
      'ika-yaki': '#a8721f',      // イカ焼き：焼き色
      nachos: '#c47a1f',          // ナチョス：チーズ/コーン
      pineapple: '#c4a010',       // 冷凍パイン：黄
      dragonfruit: '#c23a7a',     // ドラゴンフルーツ：マゼンタピンク
      mango: '#c4711f',           // マンゴー：橙
      'soft-drink': '#2f7fae',    // ドリンク各種：清涼な青
    }
    function getIconColor(item) { return ICON_COLOR[item.icon || item.id] || 'var(--gray-700)' }

    const GENRE_TOKEN = {
      food: { bg: 'var(--genre-food-bg)', ink: 'var(--genre-food-ink)' },
      alcohol: { bg: 'var(--genre-alcohol-bg)', ink: 'var(--genre-alcohol-ink)' },
      'non-alcohol': { bg: 'var(--genre-non-alcohol-bg)', ink: 'var(--genre-non-alcohol-ink)' },
    }

    // LocalStorageキー定数（index.html〈iPhone版〉と同一。移行後も端末内の
    // 未エクスポートデータをそのまま引き継げるようにする）
    const STORAGE_KEYS = {
      SESSION_ID: 'oca_session_id',
      TRANSACTIONS: 'oca_transactions',
      DATE_KEY: 'oca_date_key',
      SEQ_COUNTER: 'oca_seq_counter',
    }
    const STORAGE_WARNING_RATIO = 0.8

    // ============================================================
    // ロジック層（旧index.html〈iPhone版〉／src/logic.js より移植、無変更）
    // ============================================================
    // ランダム6文字英数字のSessionIDを生成
    function generateSessionId() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'
      let result = ''
      for (let i = 0; i < 6; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length))
      }
      return result
    }
    // YYYYMMDD形式
    function formatDate(d) {
      const y = d.getFullYear()
      const m = String(d.getMonth() + 1).padStart(2, '0')
      const day = String(d.getDate()).padStart(2, '0')
      return `${y}${m}${day}`
    }
    // HHMMSS形式
    function formatTime(d) {
      const h = String(d.getHours()).padStart(2, '0')
      const min = String(d.getMinutes()).padStart(2, '0')
      const s = String(d.getSeconds()).padStart(2, '0')
      return `${h}${min}${s}`
    }
    // TransactionID生成: {SessionID}_{YYYYMMDD}_{HHMMSS}_{連番4桁}
    function generateTransactionId(sessionId, date, counter) {
      return `${sessionId}_${formatDate(date)}_${formatTime(date)}_${String(counter).padStart(4, '0')}`
    }
    // 当日キー（YYYYMMDD形式）
    function todayKey() { return formatDate(new Date()) }

    // カートに品目を追加する（同一品目・同一サイズは数量加算）
    function addToCart(cart, itemId, name, size, sizeLabel, price) {
      const existing = cart.find(item => item.itemId === itemId && item.size === size)
      if (existing) {
        return cart.map(item =>
          item.itemId === itemId && item.size === size
            ? { ...item, quantity: item.quantity + 1 }
            : item
        )
      }
      return [...cart, { itemId, name, size, sizeLabel, price, quantity: 1 }]
    }
    // カート内品目の数量を増減する（0になったら削除）
    function updateCartQty(cart, itemId, size, delta) {
      return cart
        .map(item =>
          item.itemId === itemId && item.size === size
            ? { ...item, quantity: item.quantity + delta }
            : item
        )
        .filter(item => item.quantity > 0)
    }
    function clearCart() { return [] }
    function getCartTotal(cart) { return cart.reduce((sum, item) => sum + item.price * item.quantity, 0) }
    // お釣りを計算する（負の場合は不足）
    function calcChange(received, total) { return received - total }

    // 会計を確定してTransactionを生成する（副作用なし）
    function confirmCheckout(cart, sessionId, date, counter) {
      const newCounter = counter + 1
      const id = generateTransactionId(sessionId, date, newCounter)
      const items = cart.map(item => ({
        itemId: item.itemId, name: item.name, size: item.size, sizeLabel: item.sizeLabel,
        price: item.price, quantity: item.quantity, subtotal: item.price * item.quantity,
      }))
      const total = getCartTotal(cart)
      const transaction = {
        id, sessionId, timestamp: date.toISOString(), dateKey: formatDate(date), items, total,
      }
      return { transaction, newCart: [], newCounter }
    }

    // LocalStorageから状態を復元する。
    // 日付が変わっても取引は消さない（全期間ぶんを保持）。日付が変わったときは
    // その日の管理を新規に始める＝セッションID再生成・連番0
    // （persist-and-sales-view 要件1・2）
    function loadState(storage) {
      try {
        const today = todayKey()
        const savedDateKey = storage.getItem(STORAGE_KEYS.DATE_KEY)
        const dateRolled = !!savedDateKey && savedDateKey !== today

        let transactions = []
        try {
          const parsed = JSON.parse(storage.getItem(STORAGE_KEYS.TRANSACTIONS) || '[]')
          transactions = Array.isArray(parsed) ? parsed : []
        } catch {
          transactions = []
          storage.setItem(STORAGE_KEYS.TRANSACTIONS, '[]')
        }

        let sessionId, seqCounter
        if (dateRolled || !savedDateKey) {
          // 新しい日（または初回）：その日ぶんの管理を新規に始める
          sessionId = generateSessionId()
          seqCounter = 0
          storage.setItem(STORAGE_KEYS.SESSION_ID, sessionId)
          storage.setItem(STORAGE_KEYS.SEQ_COUNTER, '0')
          storage.setItem(STORAGE_KEYS.DATE_KEY, today)
        } else {
          // 同じ日：従来どおり復元（挙動不変）
          sessionId = storage.getItem(STORAGE_KEYS.SESSION_ID)
          if (!sessionId) {
            sessionId = generateSessionId()
            storage.setItem(STORAGE_KEYS.SESSION_ID, sessionId)
          }
          seqCounter = parseInt(storage.getItem(STORAGE_KEYS.SEQ_COUNTER) || '0', 10)
        }
        return { sessionId, transactions, dateKey: today, seqCounter }
      } catch (e) {
        return { sessionId: generateSessionId(), transactions: [], dateKey: todayKey(), seqCounter: 0 }
      }
    }
    // 状態をLocalStorageに保存する。日付キーは「起動時に確定した稼働日」を書く
    // （開きっぱなしで日付をまたいでも、次回リロードでロールを正しく検出できる）
    function saveState(storage, state) {
      try {
        storage.setItem(STORAGE_KEYS.SESSION_ID, state.sessionId)
        storage.setItem(STORAGE_KEYS.TRANSACTIONS, JSON.stringify(state.transactions))
        storage.setItem(STORAGE_KEYS.DATE_KEY, state.dateKey || todayKey())
        storage.setItem(STORAGE_KEYS.SEQ_COUNTER, String(state.seqCounter))
        return { success: true }
      } catch (e) {
        return { success: false, error: e }
      }
    }
    // LocalStorageの使用容量を確認する（80%超過でwarning）。
    // 実データ長ベースの見積もりと navigator.storage.estimate() ベースの見積もりを
    // 両方計算し、より逼迫している方（比率が高い方）を採用する。
    // navigator.storage.estimate() はCache/IndexedDB込みの原点全体の見積もりで、
    // iOS SafariではlocalStorage単体の実quota（5〜10MB程度）よりずっと大きい値を
    // 返すことがあり、それだけに頼ると警告が遅れる／出ない恐れがあるため
    // （storage-failure-visibility spec 要件2）。
    async function checkStorageUsage(storage) {
      let manualRatio = 0
      try {
        let totalSize = 0
        for (const key of Object.values(STORAGE_KEYS)) {
          const val = storage.getItem(key)
          if (val) totalSize += val.length * 2 // UTF-16 = 2 bytes/char
        }
        const estimatedQuota = 5 * 1024 * 1024 // 5MB（localStorage実質上限の保守的な仮定）
        manualRatio = totalSize / estimatedQuota
      } catch { /* noop */ }

      let apiRatio = 0
      try {
        if (typeof navigator !== 'undefined' && navigator.storage && navigator.storage.estimate) {
          const { usage, quota } = await navigator.storage.estimate()
          apiRatio = quota > 0 ? usage / quota : 0
        }
      } catch { /* noop */ }

      const ratio = Math.max(manualRatio, apiRatio)
      return { ratio, warning: ratio >= STORAGE_WARNING_RATIO }
    }
    // エクスポートデータ（JSON文字列）を生成する
    function exportData(sessionId, transactions) {
      const exportObj = {
        version: '1.0', exportedAt: new Date().toISOString(), sessionId, dateKey: todayKey(), transactions,
      }
      return JSON.stringify(exportObj, null, 2)
    }
    // インポートデータをパースして既存Transactionとマージする（重複IDはスキップ）
    function importData(jsonText, existingTransactions) {
      let parsed
      try { parsed = JSON.parse(jsonText) } catch {
        return { transactions: existingTransactions, added: 0, skipped: 0, error: 'JSONの形式が正しくありません' }
      }
      if (!parsed || !Array.isArray(parsed.transactions)) {
        return { transactions: existingTransactions, added: 0, skipped: 0, error: 'データ形式が不正です（transactionsフィールドが見つかりません）' }
      }
      const existingIds = new Set(existingTransactions.map(t => t.id))
      let added = 0, skipped = 0
      const newTransactions = [...existingTransactions]
      for (const tx of parsed.transactions) {
        if (!tx.id) { skipped++; continue }
        if (existingIds.has(tx.id)) { skipped++ }
        else { newTransactions.push(tx); existingIds.add(tx.id); added++ }
      }
      return { transactions: newTransactions, added, skipped }
    }
    // エクスポート後にリセットした新しい状態を返す
    function resetAfterExport(currentState) {
      return { ...currentState, sessionId: generateSessionId(), transactions: [], seqCounter: 0 }
    }
    // ============================================================
    // AppState
    // ============================================================
    let AppState = {
      sessionId: '', cart: [], transactions: [], currentView: 'order', seqCounter: 0,
      dateKey: '', salesDate: null, deleteMode: false,
      received: '',
    }

    function formatPrice(n) { return '¥' + n.toLocaleString('ja-JP') }

    // HTMLエスケープ。取引データ（品目名・サイズ・日付キー・取引ID等）は
    // 「データをインポート」経由で外部JSONから来る可能性があり、
    // ITEM_MASTER由来の信頼できる文字列と違って無条件に信用できない。
    // innerHTMLで描画する箇所へ埋め込む前に必ずこれを通す（xss-fix-sales-view）
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]))
    }

    function showToast(message, type, duration) {
      const el = document.getElementById('toast')
      if (!el) return
      el.textContent = message
      el.className = 'show' + (type ? ' ' + type : '')
      clearTimeout(showToast._t)
      showToast._t = setTimeout(() => { el.className = '' }, duration || 2200)
    }

    // 保存結果（{success, error}）を呼び出し元が確認できるよう戻り値を返す
    // （storage-failure-visibility spec：以前は結果を誰も見ておらず、容量超過で
    // 保存に失敗しても画面は「成功」のまま気づけなかった）
    function persist() {
      try {
        return saveState(localStorage, AppState)
      } catch (e) {
        return { success: false, error: e }
      }
    }

    // 容量チェックを再実行してバナー表示を更新する（起動時だけでなく、
    // データが増える会計確定のたびに呼ぶ。storage-failure-visibility 要件2.2）
    function refreshStorageWarning() {
      checkStorageUsage(localStorage).then(result => {
        const banner = document.getElementById('storage-warning')
        if (banner) banner.style.display = result.warning ? 'block' : 'none'
      })
    }

    // ============================================================
    // Render：注文画面
    // ============================================================
    function render() {
      renderItemGrid()
      renderOrderFooter()
    }

    function renderItemGrid() {
      const cartMap = {}
      AppState.cart.forEach(i => { cartMap[i.itemId + '_' + i.size] = i.quantity })

      let html = ''
      GENRE_ORDER.forEach(genre => {
        const items = ITEM_MASTER.filter(it => it.genre === genre)
        if (items.length === 0) return
        const tok = GENRE_TOKEN[genre]
        html += `<div class="genre-section" style="background:${tok.bg}">`
        html += `<div class="genre-section-header" style="background:${tok.bg};color:${tok.ink}">${GENRE_LABEL[genre]}</div>`
        html += `<div class="item-grid">`
        items.forEach(item => {
          const svg = getItemSvg(item)
          const isMulti = item.sizes.length > 1
          // 複数サイズ品目はカードを2カラム分に広げる（要件12）
          html += `<div class="item-card${isMulti ? ' item-card--wide' : ''}">`
          html += `<div class="item-card-header"><span class="item-card-icon" style="color:${getIconColor(item)}">${svg}</span><span class="item-card-name">${item.name}</span></div>`
          html += `<div class="item-card-body">`
          item.sizes.forEach(s => {
            const qty = cartMap[item.id + '_' + s.size] || 0
            // 統一パターン（fullwidth-grid-bottombar 要件2）：
            //   ボタン本体タップ = ＋1／qty>0 で 左上=−1ボタン・右上=数量バッジ（表示専用）
            // 品目ボタンは無彩色。R/M/J のラベルだけ文字色をサイズ色に（要件8・11）
            const nm = item.name + (s.label ? ' ' + s.label : '')
            const szVar = s.label ? ` style="--sz:var(--size-${s.size}-ink)"` : ''
            html += `<div class="item-size-slot">`
            html += `<button class="item-price-btn"${szVar} onclick="handleAddItem('${item.id}','${s.size}')" aria-label="${nm} を追加">`
            if (s.label) html += `<span class="item-size-label">${s.label}</span>`
            html += `<span class="item-size-price num">${formatPrice(s.price)}</span>`
            html += `</button>`
            if (qty > 0) {
              html += `<button class="qty-minus" onclick="handleCartQty('${item.id}','${s.size}',-1)" aria-label="${nm} を1つ減らす">−</button>`
              html += `<span class="qty-badge num" aria-label="${nm} ${qty}個">${qty}</span>`
            }
            html += `</div>`
          })
          html += `</div></div>`
        })
        html += `</div></div>`
      })
      document.getElementById('item-grid').innerHTML = html
    }

    // 下部バー：合計金額の更新と、お会計／ピッタリの活性切り替え
    // （注文中一覧はカード上のバッジ／±で見えるので独立表示しない）
    function renderOrderFooter() {
      document.getElementById('order-total').textContent = formatPrice(getCartTotal(AppState.cart))
      const cartEmpty = AppState.cart.length === 0
      document.getElementById('btn-checkout').disabled = cartEmpty
      document.getElementById('btn-pittari-checkout').disabled = cartEmpty
    }

    function findItem(itemId) { return ITEM_MASTER.find(i => i.id === itemId) }
    function findSize(item, size) { return item.sizes.find(s => s.size === size) }

    function handleAddItem(itemId, size) {
      const item = findItem(itemId)
      const s = findSize(item, size)
      AppState.cart = addToCart(AppState.cart, item.id, item.name, s.size, s.label, s.price)
      renderItemGrid(); renderOrderFooter()
    }
    function handleCartQty(itemId, size, delta) {
      AppState.cart = updateCartQty(AppState.cart, itemId, size, delta)
      renderItemGrid(); renderOrderFooter()
    }
    function handleClearCart() {
      if (AppState.cart.length === 0) return
      AppState.cart = clearCart()
      AppState.received = ''
      renderItemGrid(); renderOrderFooter()
    }

    // ============================================================
    // 会計モーダル（checkout-modal-restore：常設パネルから復帰）
    // ============================================================
    function handleCheckout() {
      if (AppState.cart.length === 0) return
      openCheckoutModal()
    }
    function openCheckoutModal() {
      AppState.received = ''
      document.getElementById('modal-total').textContent = formatPrice(getCartTotal(AppState.cart))
      updateChangeDisplay()
      document.getElementById('modal-checkout').classList.add('open')
    }
    function closeCheckoutModal() {
      document.getElementById('modal-checkout').classList.remove('open')
    }
    function handleModalBgClick(e) {
      if (e.target.id === 'modal-checkout') closeCheckoutModal()
    }

    // ============================================================
    // カート内訳ポップアップ（合計金額タップで開く。閲覧専用。cart-detail-popup）
    // ============================================================
    function openCartDetailModal() {
      const list = document.getElementById('cart-detail-list')
      if (AppState.cart.length === 0) {
        list.innerHTML = '<div class="sales-empty">カートは空です</div>'
      } else {
        list.innerHTML = AppState.cart.map(c =>
          `<div class="item-stat-row"><span class="item-stat-name">${escapeHtml(c.name)}</span>${c.sizeLabel ? `<span class="item-stat-size">${escapeHtml(c.sizeLabel)}</span>` : ''}<span class="item-stat-qty num">${c.quantity}個</span><span class="item-stat-amount num">${formatPrice(c.price * c.quantity)}</span></div>`
        ).join('')
      }
      document.getElementById('cart-detail-total-amount').textContent = formatPrice(getCartTotal(AppState.cart))
      document.getElementById('modal-cart-detail').classList.add('open')
    }
    function closeCartDetailModal() {
      document.getElementById('modal-cart-detail').classList.remove('open')
    }
    function handleCartDetailModalBgClick(e) {
      if (e.target.id === 'modal-cart-detail') closeCartDetailModal()
    }

    function updateChangeDisplay() {
      const total = getCartTotal(AppState.cart)
      const receivedNum = AppState.received === '' ? null : Number(AppState.received)
      const displayEl = document.getElementById('modal-received-display')
      const changeEl = document.getElementById('change-display')
      const confirmBtn = document.getElementById('btn-confirm')
      if (receivedNum === null) {
        displayEl.textContent = '—'; displayEl.classList.add('empty')
        changeEl.textContent = '—'; changeEl.classList.remove('shortage')
        confirmBtn.disabled = true
        return
      }
      displayEl.textContent = formatPrice(receivedNum); displayEl.classList.remove('empty')
      const change = calcChange(receivedNum, total)
      if (change < 0) {
        changeEl.textContent = '不足 ' + formatPrice(-change); changeEl.classList.add('shortage')
        confirmBtn.disabled = true
      } else {
        changeEl.textContent = formatPrice(change); changeEl.classList.remove('shortage')
        confirmBtn.disabled = false
      }
    }
    function setReceived(amount) { AppState.received = String(amount); updateChangeDisplay() }
    function addReceived(amount) {
      const cur = AppState.received === '' ? 0 : Number(AppState.received)
      AppState.received = String(cur + amount); updateChangeDisplay()
    }
    function setExact() { setReceived(getCartTotal(AppState.cart)) }
    function numpadInput(digit) {
      const cur = AppState.received === '' ? '' : AppState.received
      const next = (cur === '0' ? '' : cur) + digit
      if (next.length > 7) return
      AppState.received = next; updateChangeDisplay()
    }
    function numpadDelete() { AppState.received = AppState.received.slice(0, -1); updateChangeDisplay() }
    function numpadClear() { AppState.received = ''; updateChangeDisplay() }

    function handleConfirmCheckout() {
      const total = getCartTotal(AppState.cart)
      const receivedNum = Number(AppState.received || 0)
      if (calcChange(receivedNum, total) < 0) return
      const { transaction, newCart, newCounter } = confirmCheckout(
        AppState.cart, AppState.sessionId, new Date(), AppState.seqCounter
      )
      AppState.transactions.push(transaction)
      AppState.cart = newCart
      AppState.seqCounter = newCounter
      AppState.received = ''
      const result = persist()
      closeCheckoutModal()
      render()
      if (result && result.success === false) {
        // 保存に失敗＝この会計は端末に残っていない可能性が高い。
        // 「会計完了！」と偽の安心感を与えず、はっきり分かる警告を長めに出す
        showToast('⚠️ 保存に失敗しました。売上データが記録されていない可能性があります。データ容量を確認してください', 'error', 6000)
      } else {
        showToast('会計完了！', 'success')
      }
      refreshStorageWarning()
    }

    // ぴったり金額で1タップ完了（2026-09-11追加。要件7）
    // 「お預かり金額を合計と同額にする」＋「そのまま確定する」を1操作にまとめる。
    // 既存の紙幣クイック内「ぴったり」（setExactのみ・確定はしない）とは別物。
    function handlePittariConfirm() {
      if (AppState.cart.length === 0) return
      setExact()
      handleConfirmCheckout()
    }

    // ============================================================
    // 売上確認ビュー
    // ============================================================
    function handleOpenSales() {
      AppState.currentView = 'sales'
      document.getElementById('app-order').classList.remove('active')
      document.getElementById('app-sales').classList.add('active')
      document.getElementById('session-id-sales').textContent = AppState.sessionId
      AppState.salesDate = AppState.salesDate || todayKey()
      renderSalesView()
    }
    function handleCloseSales() {
      AppState.currentView = 'order'
      document.getElementById('app-sales').classList.remove('active')
      document.getElementById('app-order').classList.add('active')
      render()
    }
    function switchSalesDate(date) { AppState.salesDate = date; renderSalesView() }
    function toggleDeleteMode() { AppState.deleteMode = !AppState.deleteMode; renderSalesView() }
    function handleDeleteTransaction(txId) {
      AppState.transactions = AppState.transactions.filter(t => t.id !== txId)
      persist()
      renderSalesView()
      showToast('取引を削除しました', 'success')
    }

    // ============================================================
    // 1日ぶんのデータを長押しで削除（delete-day-data）
    // 通常のタップでは反応せず、DELETE_DAY_HOLD_MSぶん押し続けたときだけ
    // 確認ポップアップを開く。誤操作でのデータ消失を防ぐための二段階確認
    // ============================================================
    let deleteDayTimer = null
    const DELETE_DAY_HOLD_MS = 700

    function handleDeleteDayPressStart(e) {
      const btn = document.getElementById('btn-delete-day')
      if (!btn || AppState.salesDate === 'all') return
      if (e.cancelable) e.preventDefault()
      btn.classList.add('pressing')
      clearTimeout(deleteDayTimer)
      deleteDayTimer = setTimeout(() => {
        btn.classList.remove('pressing')
        openDeleteDayModal()
      }, DELETE_DAY_HOLD_MS)
    }
    function handleDeleteDayPressEnd() {
      const btn = document.getElementById('btn-delete-day')
      if (btn) btn.classList.remove('pressing')
      clearTimeout(deleteDayTimer)
    }
    function openDeleteDayModal() {
      if (AppState.salesDate === 'all') return
      const target = AppState.salesDate
      const targetTx = AppState.transactions.filter(t => t.dateKey === target)
      const total = targetTx.reduce((sum, t) => sum + t.total, 0)
      const label = escapeHtml(target.slice(0, 4) + '/' + target.slice(4, 6) + '/' + target.slice(6, 8))
      document.getElementById('delete-day-detail').innerHTML =
        `<span class="num">${label}</span>　<span class="num">${targetTx.length}</span>件の取引　<span class="num">${formatPrice(total)}</span>`
      document.getElementById('modal-delete-day').classList.add('open')
    }
    function closeDeleteDayModal() {
      document.getElementById('modal-delete-day').classList.remove('open')
    }
    function handleDeleteDayModalBgClick(e) {
      if (e.target.id === 'modal-delete-day') closeDeleteDayModal()
    }
    function handleConfirmDeleteDay() {
      const target = AppState.salesDate
      if (!target || target === 'all') { closeDeleteDayModal(); return }
      AppState.transactions = AppState.transactions.filter(t => t.dateKey !== target)
      persist()
      closeDeleteDayModal()
      renderSalesView()
      showToast('この日のデータを削除しました', 'success')
    }

    // ============================================================
    // 1日ぶんのデータをダウンロード（→完了後にその日のデータを削除。download-day-data）
    // 「ポップで確認 → ダウンロード → その日のデータを削除」の一連の流れ。
    // ダウンロード自体は端末・ブラウザにより実現方法が異なるため、
    // ①Web Share API（ファイル共有。iOSのホーム画面追加アプリでも確実） →
    // ②<a download>によるBlobダウンロード の順にフォールバックする。
    // ①でユーザーが共有をキャンセルした場合は「保存したか分からない」ため
    // 削除しない（要件：保存できたと確認できる場合のみ削除する）
    // ============================================================
    function openDownloadDayModal() {
      if (AppState.salesDate === 'all') return
      const target = AppState.salesDate
      const targetTx = AppState.transactions.filter(t => t.dateKey === target)
      const total = targetTx.reduce((sum, t) => sum + t.total, 0)
      const label = escapeHtml(target.slice(0, 4) + '/' + target.slice(4, 6) + '/' + target.slice(6, 8))
      document.getElementById('download-day-detail').innerHTML =
        `<span class="num">${label}</span>　<span class="num">${targetTx.length}</span>件の取引　<span class="num">${formatPrice(total)}</span>`
      document.getElementById('modal-download-day').classList.add('open')
    }
    function closeDownloadDayModal() {
      document.getElementById('modal-download-day').classList.remove('open')
    }
    function handleDownloadDayModalBgClick(e) {
      if (e.target.id === 'modal-download-day') closeDownloadDayModal()
    }

    // ダウンロード本体：成功したら {ok:true}、共有をキャンセルされたら
    // {ok:false, cancelled:true}、完全に失敗したら {ok:false} を返す
    async function triggerDayDownload(jsonText, filename) {
      try {
        if (typeof File !== 'undefined' && navigator.canShare) {
          const file = new File([jsonText], filename, { type: 'application/json' })
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: filename })
            return { ok: true }
          }
        }
      } catch (e) {
        if (e && e.name === 'AbortError') return { ok: false, cancelled: true }
        // 共有API自体が失敗した場合は下のダウンロードにフォールバック
      }
      try {
        const blob = new Blob([jsonText], { type: 'application/json' })
        const url = URL.createObjectURL(blob)
        const a = document.createElement('a')
        a.href = url
        a.download = filename
        document.body.appendChild(a)
        a.click()
        document.body.removeChild(a)
        setTimeout(() => URL.revokeObjectURL(url), 1000)
        return { ok: true }
      } catch (e) {
        return { ok: false }
      }
    }

    async function handleConfirmDownloadDay() {
      const target = AppState.salesDate
      if (!target || target === 'all') { closeDownloadDayModal(); return }
      const targetTx = AppState.transactions.filter(t => t.dateKey === target)
      if (targetTx.length === 0) { closeDownloadDayModal(); return }
      const dayId = targetTx[0].sessionId
      const json = exportData(dayId, targetTx)
      const filename = `会計データ_${target}.json`

      const result = await triggerDayDownload(json, filename)
      if (result.cancelled) {
        closeDownloadDayModal()
        return // 共有をキャンセル＝保存できたか分からないため削除しない
      }
      if (!result.ok) {
        closeDownloadDayModal()
        showToast('ダウンロードに失敗しました。データは削除していません', 'error')
        return
      }
      AppState.transactions = AppState.transactions.filter(t => t.dateKey !== target)
      persist()
      closeDownloadDayModal()
      renderSalesView()
      showToast('ダウンロードして、この日のデータを削除しました', 'success')
    }

    function renderSalesView() {
      const body = document.getElementById('sales-body')
      const allDates = [...new Set(AppState.transactions.map(t => t.dateKey))].sort((a, b) => b.localeCompare(a))
      const today = todayKey()
      if (AppState.salesDate !== 'all' && !allDates.includes(AppState.salesDate)) {
        AppState.salesDate = allDates.length > 0 ? allDates[0] : today
      }
      const targetTx = AppState.salesDate === 'all'
        ? AppState.transactions
        : AppState.transactions.filter(t => t.dateKey === AppState.salesDate)

      // 選択中の日付のセッションIDをヘッダーに表示（日付ごとにIDが分かれるため。要件2.5）
      const shownSessionId = AppState.salesDate === 'all'
        ? AppState.sessionId
        : (targetTx[0] ? targetTx[0].sessionId : AppState.sessionId)
      document.getElementById('session-id-sales').textContent = shownSessionId

      const total = targetTx.reduce((sum, t) => sum + t.total, 0)
      const statsMap = {}
      for (const tx of targetTx) {
        for (const item of tx.items) {
          const key = item.itemId + '_' + item.size
          if (!statsMap[key]) statsMap[key] = { name: item.name, sizeLabel: item.sizeLabel, quantity: 0, amount: 0 }
          statsMap[key].quantity += item.quantity
          statsMap[key].amount += item.subtotal
        }
      }
      const itemStats = Object.values(statsMap).sort((a, b) => b.amount - a.amount)

      let html = '<div class="date-selector">'
      html += `<button class="date-btn${AppState.salesDate === 'all' ? ' active' : ''}" onclick="switchSalesDate('all')">全期間</button>`
      allDates.forEach(d => {
        const label = d.slice(0, 4) + '/' + d.slice(4, 6) + '/' + d.slice(6, 8)
        // dateKeyはインポートJSON経由で外部から来る可能性があるため、
        // onclick内にJS文字列として直接埋め込まず、data-*属性＋
        // dataset読み出しにする（属性エスケープのみで安全になる構造。xss-fix-sales-view）
        html += `<button class="date-btn${AppState.salesDate === d ? ' active' : ''}" data-date="${escapeHtml(d)}" onclick="switchSalesDate(this.dataset.date)">${escapeHtml(label)}</button>`
      })
      html += '</div>'

      const dateLabel = AppState.salesDate === 'all' ? '全期間売上合計' : AppState.salesDate === today ? '本日売上合計' : escapeHtml(AppState.salesDate.slice(0, 4) + '/' + AppState.salesDate.slice(4, 6) + '/' + AppState.salesDate.slice(6, 8)) + ' 売上合計'
      html += `<div class="sales-total-card"><div class="sales-total-label">${dateLabel}</div><div class="sales-total-amount num">${formatPrice(total)}</div><div class="sales-total-count"><span class="num">${targetTx.length}</span>件の取引</div></div>`

      // 特定の日付を選んでいるときだけ「この日のデータを削除」ボタンを出す
      // （「全期間」の一括削除はこの機能の対象外。要件1.2）
      if (AppState.salesDate !== 'all') {
        html += `<button class="btn-delete-day" id="btn-delete-day"
          onpointerdown="handleDeleteDayPressStart(event)"
          onpointerup="handleDeleteDayPressEnd(event)"
          onpointerleave="handleDeleteDayPressEnd(event)"
          onpointercancel="handleDeleteDayPressEnd(event)">
          <span class="btn-delete-day-fill"></span>
          <span class="btn-delete-day-label">長押しでこの日のデータを削除</span>
        </button>`
      }

      html += '<div class="sales-section-title">品目別集計</div>'
      if (itemStats.length === 0) {
        html += '<div class="sales-card"><div class="sales-empty">取引なし</div></div>'
      } else {
        html += '<div class="sales-card">' + itemStats.map(s =>
          `<div class="item-stat-row"><span class="item-stat-name">${escapeHtml(s.name)}</span>${s.sizeLabel ? `<span class="item-stat-size">${escapeHtml(s.sizeLabel)}</span>` : ''}<span class="item-stat-qty num">${s.quantity}個</span><span class="item-stat-amount num">${formatPrice(s.amount)}</span></div>`
        ).join('') + '</div>'
      }

      html += `<div class="sales-section-title"><span>取引履歴</span><button class="btn-delete-mode-toggle${AppState.deleteMode ? ' active' : ''}" onclick="toggleDeleteMode()">${AppState.deleteMode ? '削除モード終了' : '削除モード'}</button></div>`
      if (targetTx.length === 0) {
        html += '<div class="sales-card"><div class="sales-empty">取引なし</div></div>'
      } else {
        const sorted = [...targetTx].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
        html += '<div class="sales-card">' + sorted.map(tx => {
          const d = new Date(tx.timestamp)
          const timeStr = AppState.salesDate === 'all'
            ? d.toLocaleString('ja-JP', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
            : d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
          const itemsStr = tx.items.map(i => escapeHtml(i.name) + (i.sizeLabel ? '(' + escapeHtml(i.sizeLabel) + ')' : '') + '×' + i.quantity).join('、')
          // tx.idもインポートJSON経由で外部から来る可能性があるため、
          // date-btnと同様にdata-*属性＋dataset読み出しにする（xss-fix-sales-view）
          const deleteBtn = AppState.deleteMode ? `<button class="btn-tx-delete" data-tx-id="${escapeHtml(tx.id)}" onclick="handleDeleteTransaction(this.dataset.txId)">削除</button>` : ''
          return `<div class="tx-row"><div class="tx-row-main"><div class="tx-row-header"><span class="tx-time num">${timeStr}</span><span class="tx-total num">${formatPrice(tx.total)}</span></div><div class="tx-items">${itemsStr}</div></div>${deleteBtn}</div>`
        }).join('') + '</div>'
      }

      html += '<div class="share-section"><div class="share-section-title">データ共有</div>' +
        // 特定の日付を選んでいるときだけ「この日をダウンロード」ボタンを出す
        // （ダウンロード完了後にその日のデータを削除する。要件は「全期間」の対象外。download-day-data）
        (AppState.salesDate !== 'all'
          ? '<button class="btn-download-day" id="btn-download-day" onclick="openDownloadDayModal()">この日のデータをダウンロード</button>'
          : '') +
        '<button class="btn-export" id="btn-export" onclick="handleExport()">データをコピーして共有</button>' +
        '<div class="export-fallback-area" id="export-fallback-area" style="display:none">' +
        '<textarea class="export-fallback-textarea" id="export-fallback" readonly></textarea>' +
        '<div class="export-fallback-note">上記をコピーしてLINEなどで送ってください</div></div>' +
        '<button class="btn-import-toggle" onclick="toggleImportArea()">データをインポート</button>' +
        '<div class="import-area" id="import-area" style="display:none">' +
        '<textarea class="import-textarea" id="import-textarea" placeholder="コピーしたJSONを貼り付けてください"></textarea>' +
        '<button class="btn-import-exec" onclick="handleImport()">取り込む</button></div></div>'

      body.innerHTML = html
    }

    async function handleExport() {
      const json = exportData(AppState.sessionId, AppState.transactions)
      try {
        await navigator.clipboard.writeText(json)
        showToast('コピーしました。LINEなどで集計担当者に送ってください。', 'success')
      } catch (e) {
        const area = document.getElementById('export-fallback-area')
        const ta = document.getElementById('export-fallback')
        if (area && ta) { ta.value = json; area.style.display = 'block'; ta.select() }
        showToast('手動でコピーしてください', 'warning')
        return
      }
      if (confirm('このデータをリセットしますか？')) {
        const newState = resetAfterExport(AppState)
        AppState.sessionId = newState.sessionId
        AppState.transactions = newState.transactions
        AppState.seqCounter = newState.seqCounter
        persist()
        renderSalesView()
        showToast('リセットしました', 'success')
      }
    }
    function toggleImportArea() {
      const area = document.getElementById('import-area')
      area.style.display = area.style.display === 'none' ? 'block' : 'none'
    }
    function handleImport() {
      const ta = document.getElementById('import-textarea')
      const json = ta.value.trim()
      if (!json) { showToast('データを貼り付けてください', 'warning'); return }
      const result = importData(json, AppState.transactions)
      if (result.error) { showToast(result.error, 'error'); return }
      AppState.transactions = result.transactions
      persist()
      renderSalesView()
      showToast(result.added + '件取り込みました。' + result.skipped + '件はスキップしました。', 'success')
    }

    // ============================================================
    // 起動処理
    // ============================================================
    try {
      const saved = loadState(localStorage)
      AppState.sessionId = saved.sessionId || generateSessionId()
      AppState.transactions = Array.isArray(saved.transactions) ? saved.transactions : []
      AppState.seqCounter = typeof saved.seqCounter === 'number' ? saved.seqCounter : 0
      AppState.dateKey = saved.dateKey || todayKey()
    } catch (e) {
      AppState.sessionId = generateSessionId()
      AppState.transactions = []
      AppState.seqCounter = 0
    }
    persist()
    render()
    refreshStorageWarning()

    // ── ビューポート高さの動的設定（index.html と同じ --real-vh パターン） ──
    function setViewportHeight() {
      const vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight)
      document.documentElement.style.setProperty('--real-vh', vh + 'px')
    }
    setViewportHeight()
    if (window.visualViewport) window.visualViewport.addEventListener('resize', setViewportHeight)
    window.addEventListener('resize', setViewportHeight)

    // ── 拡大縮小の無効化（menu-merge-grid-lock 要件4） ──
    // iOS Safari は user-scalable=no を無視するため、ピンチズームのジェスチャを抑止する。
    // ダブルタップズームは html { touch-action: manipulation } で無効化済み。
    ;['gesturestart', 'gesturechange', 'gestureend'].forEach((ev) => {
      document.addEventListener(ev, (e) => e.preventDefault(), { passive: false })
    })

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {})
    }
  </script>
</body>
